name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake doxygen graphviz gcovr lcov

    - name: Configure CMake
      run: cmake -S ./ -B build/

    - name: Build
      run: cmake --build build/

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure

    - name: Build with coverage
      run: |
        cmake -D WANT_COVERAGE=ON -D CMAKE_BUILD_TYPE=Debug -S ./ -B build-coverage/
        cmake --build build-coverage/ --clean-first --target all test_coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./build-coverage/test_coverage/coverage.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Generate documentation
      run: cmake --build build/ --target docs

    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: build/Testing/

    - name: Archive documentation
      uses: actions/upload-artifact@v4
      with:
        name: doxygen-docs
        path: docs/html/
